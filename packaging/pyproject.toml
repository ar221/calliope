# Calliope — pipx packaging definition.
#
# Current shape: the source is a single-file Python script at
# `server/calliope-server` (no `.py` extension, no package layout). The
# `[project.scripts]` and `[tool.hatch.build.targets.wheel]` entries below
# assume a future restructure to `calliope_dictation/server.py` with a
# package layout and a `main()` entry point.
#
# TODO: land the package-layout restructure before publishing to PyPI.
# Until then this file is a forward-looking definition, not a buildable
# spec — `pipx install` against this tree will fail because the
# `calliope_dictation` package doesn't yet exist.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calliope-dictation"
version = "0.1.0"
description = "Local-first voice dictation server for SillyTavern"
authors = [{name = "Ayaz Rashid", email = "rashid.ayaz@gmail.com"}]
license = "MIT"
readme = "../README.md"  # README lives at repo root; pyproject sits in packaging/
requires-python = ">=3.10"
dependencies = []  # stdlib only — PyYAML/wordfreq are optional for graceful degradation
keywords = ["whisper", "stt", "dictation", "sillytavern", "speech-to-text"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
vocab-quality = ["wordfreq>=3.0"]
all = ["pyyaml>=6.0", "wordfreq>=3.0"]

[project.scripts]
calliope-server = "calliope_dictation.server:main"

[project.urls]
Homepage = "https://github.com/ar221/calliope"
Issues = "https://github.com/ar221/calliope/issues"

[tool.hatch.build.targets.wheel]
packages = ["calliope_dictation"]

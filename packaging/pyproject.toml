# Calliope — pipx packaging definition.
#
# Current shape: the canonical source remains the single-file Python script at
# `server/calliope-server` (no `.py` extension, no runtime package layout).
# Hatch copies that exact artifact into the wheel as `calliope_dictation/_server.py`
# so `pipx install ./packaging` exposes the intended `calliope-server` command
# without lifting the embedded PWA out of the single-file server source.
#
# Publication note: keep this as a packaging adapter only. Do not move WEB_UI or
# other runtime assets into a separate browser bundle as part of pipx packaging.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calliope-dictation"
version = "0.1.0"
description = "Local-first voice dictation server for SillyTavern"
authors = [{name = "Ayaz Rashid", email = "rashid.ayaz@gmail.com"}]
license = "MIT"
readme = "../README.md"  # README lives at repo root; pyproject sits in packaging/
requires-python = ">=3.10"
dependencies = []  # stdlib only — PyYAML/wordfreq are optional for graceful degradation
keywords = ["whisper", "stt", "dictation", "sillytavern", "speech-to-text"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
vocab-quality = ["wordfreq>=3.0"]
all = ["pyyaml>=6.0", "wordfreq>=3.0"]

[project.scripts]
calliope-server = "calliope_dictation._server:main"

[project.urls]
Homepage = "https://github.com/ar221/calliope"
Issues = "https://github.com/ar221/calliope/issues"

[tool.hatch.build.targets.wheel]
packages = ["calliope_dictation"]

[tool.hatch.build.targets.wheel.force-include]
"../server/calliope-server" = "calliope_dictation/_server.py"
"../server/voice_catalog.json" = "calliope_dictation/voice_catalog.json"
